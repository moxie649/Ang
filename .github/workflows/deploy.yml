script: |
  set -euo pipefail
  echo "================ 开始部署 ================"
  cd ${{ secrets.SERVER_DEPLOY_PATH }}

  # 1. 拉取最新代码（如果目录不是Git仓库，先初始化）
  echo ">>> 拉取代码"
  if [ ! -d .git ]; then
    git init
    git remote add origin https://github.com/moxie649/Ang.git
  fi
  git pull origin main || true

  # 2. 停止并删除旧容器（容错）
  echo ">>> 停止旧容器"
  docker stop my-app 2>/dev/null || true
  docker rm my-app 2>/dev/null || true

  # 3. 构建镜像（固定小写，避免报错）
  echo ">>> 构建镜像"
  docker build -t my-app:latest .

  # 4. 启动新容器
  echo ">>> 启动容器"
  docker run -d \
    --name my-app \
    --restart=always \
    -p 3000:3000 \
    my-app:latest

  # 5. 清理无用镜像
  echo ">>> 清理镜像"
  docker image prune -f

  echo "================ 部署完成 ================"