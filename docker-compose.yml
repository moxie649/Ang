services:
  # 前端 Nginx 服务
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - DOCKER_REGISTRY=${DOCKER_REGISTRY:-docker.io}
    container_name: react-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: always
    depends_on:
      - backend
    networks:
      - app-network
    environment:
      - NODE_ENV=${NODE_ENV:-production}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 后端 Node.js 服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - DOCKER_REGISTRY=${DOCKER_REGISTRY:-docker.io}
    container_name: node-backend
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    restart: always
    volumes:
      # uploads 目录持久化
      - uploads-data:/app/uploads
    networks:
      - app-network
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3001
      - UPLOAD_DIR=/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# 数据卷定义
volumes:
  uploads-data:
    driver: local

# 网络定义
networks:
  app-network:
    driver: bridge
